<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Saved sign-ups — Cook &amp; Bake</title>
  <style>
    :root{--ink:#1f332d;--muted:#58675f;--line:#d8ddd3;--paper:#f6f5ef;--accent:#ae572f}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1200px;margin:0 auto;padding:34px 22px 80px}a{color:#853d22;text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:3px solid #bb683e;outline-offset:3px}h1{font:500 clamp(2rem,4vw,3.5rem)/1.1 Georgia,serif;margin:18px 0 12px;letter-spacing:-.04em}p{color:var(--muted);max-width:780px}button{border:0;background:var(--ink);color:#fff;border-radius:7px;font:700 .9rem system-ui,sans-serif;min-height:44px;padding:10px 17px;cursor:pointer;margin:12px 0 18px}button:hover{background:#375a48}button:disabled{opacity:.5;cursor:not-allowed}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{text-align:left;vertical-align:top;padding:11px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{background:#e9eee7;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}tbody tr:last-child td{border-bottom:0}.status{font-weight:700;color:var(--accent)}.empty{padding:20px;background:#fff;border:1px solid var(--line)}
  </style>
</head>
<body>
  <main>
    <a href="index.html#courses">← Back to courses</a>
    <h1>Saved sign-ups on this device</h1>
    <p>These records come from this browser’s local storage. They are not shared with other devices or sent to the academy automatically. Export the CSV to keep a copy.</p>
    <button id="export-csv" type="button" disabled>Export CSV</button>
    <p id="status" class="status" role="status"></p>
    <div id="list" class="table-wrap"></div>
  </main>
  <script src="admin.js" defer></script>
</body>
</html>
